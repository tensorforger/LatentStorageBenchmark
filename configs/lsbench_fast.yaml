benchmark_name: lsbench_fast
num_samples: 5
image:
  width: 1024
  height: 1024
  batch_size: 4
  datasets:
    - axis-v1_1k
  vaes:
    - no_vae
    - name: flux_2
      path_to_model: models/FLUX.2-klein-4B/vae
    - name: qwen_image_2_1
      path_to_model: models/texture-fix-vae-for-qwen-image-2.1
    - name: flux_1
      path_to_model: models/FLUX.1-schnell/vae
    - name: sd_3_5
      path_to_model: models/stable-diffusion-3.5-large/vae
    - name: sdxl
      path_to_model: models/sdxl-vae
  latent_storages:
    - fp32
    - fp16
    - bf16
    # 8-bit
    - fp8_e4m3
    - fp8_e5m2
    - fp8_e4m3_scaled
    - mxfp8
    - int8_tensor
    - int8_channel
    - int8_group
    - int8_asym
    - int8_mse_clip
    - int8_outlier
    - int8_hadamard
    - int8_mulaw
    - nf8
    # 4-bit
    - nvfp4
    - mxfp4
    - int4_group
    - int4_asym_group
    - {name: int4_asym_group, group_size: 4}
    - {name: int4_asym_group, group_size: 16}
    - {name: int4_asym_group, group_size: 64}
    - {name: int4_asym_square, block: 2}
    - {name: int4_asym_square, block: 4}
    - {name: int4_asym_square, block: 8}
    - int4_minmax_group
    - {name: int4_minmax_group, group_size: 4}
    - {name: int4_minmax_group, group_size: 16}
    - {name: int4_minmax_group, group_size: 64}
    - {name: int4_minmax_square, block: 2}
    - {name: int4_minmax_square, block: 4}
    - {name: int4_minmax_square, block: 8}
    - {name: int2_minmax_square, block: 2}
    - {name: int2_minmax_square, block: 4}
    - {name: int2_minmax_square, block: 8}
    - {name: int6_minmax_square, block: 2}
    - {name: int6_minmax_square, block: 4}
    - {name: int6_minmax_square, block: 8}
    - {name: int8_minmax_square, block: 2}
    - {name: int8_minmax_square, block: 4}
    - {name: int8_minmax_square, block: 8}
    - {name: lloyd_minmax_square, bits: 2, block: 4, range_bits: 5}
    - {name: lloyd_minmax_square, bits: 3, block: 4, range_bits: 5}
    - {name: lloyd_minmax_square, bits: 3, block: 8, range_bits: 6}
    # orthogonal approaches
    - fp16_shuffle_zstd
    - {name: dct_zstd, step: 0.05}
    - {name: dct_zstd, step: 0.1}
    - {name: dct_zstd, step: 0.2}
    - {name: dct_zstd, step: 0.1, block: 4}
    - {name: tucker, rank_c: 16, rank_hw: 64}
    - {name: tucker, rank_c: 24, rank_hw: 96}
    - {name: lloyd_minmax_square, bits: 4, block: 4, range_bits: 5}
    - {name: lloyd_minmax_square, bits: 4, block: 8, range_bits: 6}
    - {name: lloyd_minmax_square, bits: 5, block: 4, range_bits: 5}
    - {name: lloyd_minmax_square, bits: 5, block: 8, range_bits: 6}
    - {name: lloyd_minmax_square, bits: 6, block: 8, range_bits: 6}
    - {name: lloyd_minmax_square, bits: 7, block: 8, range_bits: 6}
    - {name: lloyd_minmax_square, bits: 8, block: 8, range_bits: 6}
    # lloyd: one table per latent channel (_pc) vs one per sample
    - {name: lloyd_minmax_square, bits: 2, block: 4, range_bits: 5, per_channel: true}
    - {name: lloyd_minmax_square, bits: 3, block: 4, range_bits: 5, per_channel: true}
    - {name: lloyd_minmax_square, bits: 3, block: 8, range_bits: 6, per_channel: true}
    - {name: lloyd_minmax_square, bits: 4, block: 4, range_bits: 5, per_channel: true}
    - {name: lloyd_minmax_square, bits: 4, block: 8, range_bits: 6, per_channel: true}
    - {name: lloyd_minmax_square, bits: 5, block: 4, range_bits: 5, per_channel: true}
    - {name: lloyd_minmax_square, bits: 5, block: 8, range_bits: 6, per_channel: true}
    - {name: lloyd_minmax_square, bits: 6, block: 8, range_bits: 6, per_channel: true}
    - {name: lloyd_minmax_square, bits: 7, block: 8, range_bits: 6, per_channel: true}
    - {name: lloyd_minmax_square, bits: 8, block: 8, range_bits: 6, per_channel: true}
    - {name: normal_cdf_minmax_square, bits: 4, block: 4, range_bits: 5}
    - {name: normal_cdf_minmax_square, bits: 3, block: 4, range_bits: 5, std_scale: 2.5}
    - {name: normal_cdf_minmax_square, bits: 4, block: 4, range_bits: 5, std_scale: 2.5}
    - {name: normal_cdf_minmax_square, bits: 4, block: 8, range_bits: 6, std_scale: 2.5}
    - {name: normal_cdf_minmax_square, bits: 5, block: 4, range_bits: 5, std_scale: 2.5}
    - int4_mse_clip
    - int4_hadamard
    - int4_outlier
    - nf4
    - nf4_dq
    - kmeans4
  metrics:
    - mse
    - fid

video:
  width: 256
  height: 256
  num_frames: 75
  batch_size: 2
  datasets:
    - movirec
  vaes:
    - no_vae
  latent_storages:
    - fp32
    - fp16
    - bf16
  metrics:
    - mse